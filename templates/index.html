<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG 私訊工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      padding: 16px;
      margin: 0;
      background: linear-gradient(to bottom, #f5f9ff, #c9e0f7);
      color: #333;
      max-width: 100%;
    }
    input, button, textarea {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    .form-block {
      margin-bottom: 20px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    }
    h2, h3, h4 {
      text-align: center;
      color: #003366;
    }
    .fade-in {
      animation: fadeIn 0.8s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ul {
      padding-left: 20px;
    }
    pre {
      white-space: pre-wrap;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      max-height: 300px;
      overflow-y: auto;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    #loading {
      display: none;
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
      color: #555;
    }
    @media (min-width: 768px) {
      body {
        max-width: 480px;
        margin: auto;
      }
    }
  </style>
</head>
<body>
  <h2>登入 IG 帳號</h2>
  <div class="form-block fade-in" id="login_section">
    <input type="text" id="login_username" placeholder="帳號">
    <input type="password" id="login_password" placeholder="密碼">
    <button onclick="login()">登入</button>
  </div>

  <div id="main" style="display:none;">
    <h3>設定私訊任務</h3>
    <div class="form-block fade-in">
      <label>IG 貼文網址</label>
      <input type="text" id="post_url" placeholder="https://www.instagram.com/p/xxxxxx">

      <label>私訊內容 <small style="font-weight:normal">（每段話請用換行鍵分隔）</small></label>
      <textarea id="message" rows="4" placeholder="輸入要傳送的私訊內容，按 Enter 換行來分隔多段訊息"></textarea>

      <label>要私訊的人數</label>
      <input type="number" id="count" placeholder="私訊人數 (預設 5)" value="5">

      <button onclick="sendDM()">開始私訊</button>
      <div id="loading">🚀 傳送中，請稍候...</div>
      <button onclick="logout()" style="margin-top: 10px; background-color: #ccc; color: #000;">登出</button>
    </div>

    <div class="form-block fade-in">
      <h4>📋 私訊紀錄</h4>
      <button onclick="loadLog()">載入紀錄</button>
      <pre id="log_output">（尚未載入紀錄）</pre>
    </div>
  </div>

  <div id="admin_panel" style="display:none;">
    <h3>帳號管理介面</h3>
    <div class="form-block fade-in">
      <label>目前帳號清單</label>
      <ul id="account_list"></ul>

      <label>新增帳號</label>
      <input type="text" id="new_user" placeholder="帳號">
      <input type="password" id="new_pass" placeholder="密碼">
      <button onclick="addAccount()">新增帳號</button>

      <label>刪除帳號</label>
      <input type="text" id="delete_user" placeholder="要刪除的帳號">
      <button onclick="deleteAccount()">刪除帳號</button>

      <button onclick="logout()" style="margin-top: 10px; background-color: #ccc; color: #000;">登出</button>
    </div>
  </div>

  <script>
    let currentUser = null;

    async function login() {
      const username = document.getElementById("login_username").value;
      const password = document.getElementById("login_password").value;

      if (username === "admin" && password === "1234") {
        document.getElementById("login_section").style.display = "none";
        document.getElementById("admin_panel").style.display = "block";
        alert("✅ 管理員登入成功！");
        loadAccounts();
        return;
      }

      const res = await fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const result = await res.json();
      if (result.status === "user") {
        currentUser = username;
        document.getElementById("login_section").style.display = "none";
        document.getElementById("main").style.display = "block";
        alert(`✅ ${username} 登入成功！`);
      } else {
        alert("❌ 登入失敗，請確認帳號密碼");
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById("main").style.display = "none";
      document.getElementById("admin_panel").style.display = "none";
      document.getElementById("login_section").style.display = "block";
      document.getElementById("login_username").value = "";
      document.getElementById("login_password").value = "";
      document.getElementById("log_output").textContent = "（尚未載入紀錄）";
      alert("🚪 已登出");
    }

    async function sendDM() {
      const post_url = document.getElementById("post_url").value;
      const message = document.getElementById("message").value;
      const count = document.getElementById("count").value;

      document.getElementById("loading").style.display = "block";

      const res = await fetch("/send_dm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
              username: document.getElementById("username").value,
              password: document.getElementById("password").value,
              post_url: document.getElementById("post_url").value,
              messages: document.getElementById("message").value.split("\n"),  // 每行一則訊息
              limit: parseInt(document.getElementById("count").value)
        })
      });

      const result = await res.json();
      alert(result.message || "發送完成");
      document.getElementById("loading").style.display = "none";
    }

    async function loadLog() {
      const res = await fetch(`/log/${currentUser}`);
      if (res.ok) {
        const text = await res.text();
        document.getElementById("log_output").textContent = text;
      } else {
        document.getElementById("log_output").textContent = "❌ 無法載入紀錄";
      }
    }

    async function loadAccounts() {
      const res = await fetch("/accounts");
      const data = await res.json();
      const list = document.getElementById("account_list");
      list.innerHTML = "";
      for (const user of data) {
        const li = document.createElement("li");
        li.textContent = user;
        list.appendChild(li);
      }
    }

    async function addAccount() {
      const username = document.getElementById("new_user").value;
      const password = document.getElementById("new_pass").value;

      const res = await fetch("/add_account", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const result = await res.json();
      alert(result.message || "新增成功");
      loadAccounts();
    }

    async function deleteAccount() {
      const username = document.getElementById("delete_user").value;

      const res = await fetch("/delete_account", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username })
      });

      const result = await res.json();
      alert(result.message || "刪除成功");
      loadAccounts();
    }

    // 原本的 sendDM 函式中加上按鈕鎖定機制
async function sendDM() {
  const post_url = document.getElementById("post_url").value;
  const message = document.getElementById("message").value;
  const count = document.getElementById("count").value;

  document.getElementById("loading").style.display = "block";

  // 🔒 禁用所有按鈕
  const buttons = document.querySelectorAll("button");
  buttons.forEach(btn => btn.disabled = true);

  try {
    const res = await fetch("/send_dm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: currentUser, post_url, message, count })
    });

    const result = await res.json();
    showToast(result.message || "發送完成", false);
  } catch (error) {
    showToast("⚠️ 發送失敗，請稍後再試", true);
  } finally {
    document.getElementById("loading").style.display = "none";
    buttons.forEach(btn => btn.disabled = false); // 🔓 恢復按鈕功能
  }
}

function showToast(text, isError) {
  let toast = document.createElement("div");
  toast.textContent = text;
  toast.style.position = "fixed";
  toast.style.bottom = "20px";
  toast.style.left = "50%";
  toast.style.transform = "translateX(-50%)";
  toast.style.background = isError ? "#ff4d4f" : "#28a745";
  toast.style.color = "#fff";
  toast.style.padding = "12px 20px";
  toast.style.borderRadius = "6px";
  toast.style.boxShadow = "0 4px 10px rgba(0,0,0,0.2)";
  toast.style.zIndex = 10000;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

  </script>
</body>
</html>
